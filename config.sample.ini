[Setup]
; device name
Name = Venus Inverter Bridge
; device serial number
Serial = 000000
; device plug ip
DeviceIp = 127.0.0.1
; enable debug in logs
debug = false

[MQTTBroker]
; ip of the Venus OS broker
address = 127.0.0.1
; port of the Venus OS broker
port = 1883
; custom name of the venus os broker
name = Device_to_Inverter

[Topics]
; device sensor info
L1 = tele/device_4B0B98/SENSOR
; device plug state
CONFIG = tele/device_4B0B98/STATE
; device plug status (Offline/Online)
LWT = tele/device_4B0B98/LWT

[Warnings]
; raise an alarm for high temperature
HighTemperature = 65
; raise an alarm for overload power
Overload = 1500
; raise an alarm for low voltage
LowVoltage = 11.8

[Options]
; Venus plug will poweroff if this value has been reached
LowBatteryShutdown = 9.30
; Venus will not power on after a low battery shutdown event until the charge detected value has not been reached
ChargeDetected = 14.65
